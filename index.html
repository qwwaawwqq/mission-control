<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Mission Control</title>
<style>
:root {
  color-scheme: light;
  --bg: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --line: #e1e0d9; --border: rgba(11,11,11,.10); --chip: rgba(11,11,11,.05); --hover: rgba(11,11,11,.04);
  --accent: #2a78d6; --violet: #6250d6; --aqua: #1baf7a;
  --good: #0ca30c; --good-text: #006300; --warn: #fab219; --warn-text: #7a5200; --serious: #ec835a; --bad: #d03b3b; --bad-text: #b02a2a;
  --you-bg: rgba(208,59,59,.08); --wait-bg: rgba(250,178,25,.12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --line: #2c2c2a; --border: rgba(255,255,255,.10); --chip: rgba(255,255,255,.07); --hover: rgba(255,255,255,.05);
    --accent: #3987e5; --violet: #9085e9; --aqua: #199e70;
    --good-text: #0ca30c; --warn-text: #fab219; --bad-text: #e66767;
    --you-bg: rgba(208,59,59,.16); --wait-bg: rgba(250,178,25,.14);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --line: #2c2c2a; --border: rgba(255,255,255,.10); --chip: rgba(255,255,255,.07); --hover: rgba(255,255,255,.05);
  --accent: #3987e5; --violet: #9085e9; --aqua: #199e70;
  --good-text: #0ca30c; --warn-text: #fab219; --bad-text: #e66767;
  --you-bg: rgba(208,59,59,.16); --wait-bg: rgba(250,178,25,.14);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px 56px; }
header.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 10px; padding-bottom: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
.brand .sub { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--good); } .dot.busy { background: var(--warn); animation: pulse 1s infinite alternate; } .dot.bad { background: var(--bad); }
@keyframes pulse { from { opacity: .4 } to { opacity: 1 } }
.actions { display: flex; align-items: center; gap: 8px; flex: none; }
.meta { color: var(--muted); font-size: 12px; }
.btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer; line-height: 1.2; font-size: 14px; }
.btn:hover { background: var(--hover); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad-text); }
.btn.sm { padding: 4px 9px; font-size: 13px; border-radius: 7px; }
.btn.ghost { background: transparent; }
.btn.armed { background: var(--bad); color: #fff; border-color: transparent; }
main.wrap { padding-top: 16px; }
section { margin-bottom: 22px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
h2 .count { background: var(--chip); color: var(--ink-2); border-radius: 999px; padding: 1px 8px; font-size: 12px; letter-spacing: 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.tile .label { color: var(--ink-2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .value { font-size: 26px; font-weight: 600; line-height: 1.15; margin-top: 2px; }
.tile .hint { color: var(--muted); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.you .value { color: var(--bad-text); }
.tile.good .value { color: var(--good-text); }
.needs { display: flex; flex-direction: column; gap: 8px; }
.need { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--you-bg); border: 1px solid var(--border); }
.need.info { background: var(--wait-bg); }
.need .ic { flex: none; width: 22px; text-align: center; font-size: 16px; line-height: 1.3; }
.need .body { flex: 1; min-width: 0; }
.need .t { font-weight: 550; }
.need .s { color: var(--ink-2); font-size: 13px; margin-top: 1px; overflow-wrap: anywhere; }
.need .act { flex: none; display: flex; gap: 6px; }
.empty { color: var(--muted); font-size: 14px; padding: 8px 2px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 12px; align-items: start; }
.repo { display: flex; flex-direction: column; gap: 10px; }
.repo.paused { outline: 2px solid var(--bad); outline-offset: -1px; }
.repo .head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.repo .head .name { font-size: 16px; font-weight: 650; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.repo .head .name a { color: inherit; }
.repo .links { font-size: 12px; color: var(--muted); white-space: nowrap; }
.repo .links a { color: var(--ink-2); }
.repo .note { color: var(--muted); font-size: 12px; margin-top: -6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; background: var(--chip); font-size: 12.5px; color: var(--ink-2); border: 1px solid transparent; }
.chip b { font-weight: 650; color: var(--ink); }
.chip.zero { opacity: .55; }
.chip .sw { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sw.plan { background: var(--violet); } .sw.ready { background: var(--good); } .sw.claimed { background: var(--warn); } .sw.in-review { background: var(--accent); } .sw.blocked { background: var(--bad); } .sw.jules { background: var(--aqua); } .sw.pause { background: var(--ink); }
.kv { font-size: 13.5px; color: var(--ink-2); }
.kv b { color: var(--ink); font-weight: 600; }
.list { display: flex; flex-direction: column; gap: 6px; }
.pr { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 8px; background: var(--chip); font-size: 13.5px; }
.pr.you { background: var(--you-bg); }
.pr.agent { background: var(--wait-bg); }
.pr .row { display: flex; gap: 8px; align-items: baseline; }
.pr .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
.pr .title a { color: inherit; }
.pr .who { color: var(--muted); font-size: 12px; white-space: nowrap; }
.pr .st { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; color: var(--ink-2); }
.st .ok { color: var(--good-text); } .st .bad { color: var(--bad-text); } .st .wait { color: var(--warn-text); }
.verdict { font-weight: 600; }
.verdict.you { color: var(--bad-text); } .verdict.agent { color: var(--warn-text); } .verdict.wait { color: var(--ink-2); }
.foot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.err { color: var(--bad-text); font-size: 13px; overflow-wrap: anywhere; }
.warnline { color: var(--warn-text); font-size: 13px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
.feed { display: flex; flex-direction: column; }
.ev { display: grid; grid-template-columns: 62px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.ev:last-child { border-bottom: 0; }
.ev .when { color: var(--muted); font-size: 12px; padding-top: 2px; white-space: nowrap; }
.ev .what { min-width: 0; overflow-wrap: anywhere; }
.ev .what .tag { color: var(--muted); font-size: 12px; margin-right: 6px; }
.ev .what .who { font-weight: 600; }
.taskform { display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1px dashed var(--border); border-radius: 8px; }
input[type=text], input[type=password], input[type=number], textarea, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; width: 100%; }
textarea { min-height: 64px; resize: vertical; }
label.f { display: block; font-size: 13px; color: var(--ink-2); margin-top: 8px; }
label.f > span { display: block; margin-bottom: 4px; }
.setup ol { padding-left: 20px; margin: 8px 0; }
.setup li { margin: 4px 0; }
.setup code { background: var(--chip); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
dialog { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); color: var(--ink); padding: 18px 18px 14px; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog h3 { margin: 0 0 8px; font-size: 17px; }
.dlg-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 14px; max-width: calc(100vw - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.25); z-index: 20; }
.toast.bad { background: var(--bad); color: #fff; }
footer { color: var(--muted); font-size: 12px; margin-top: 24px; display: flex; flex-wrap: wrap; gap: 6px 16px; }
details summary { cursor: pointer; color: var(--ink-2); font-size: 13.5px; }
.hid { display: none !important; }
table.team td { white-space: normal; }
table.team td:first-child { white-space: nowrap; }
.model { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--chip); color: var(--ink); white-space: nowrap; }
.model.m-fable { background: color-mix(in srgb, var(--violet) 22%, transparent); }
.model.m-opus { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.model.m-sonnet { background: color-mix(in srgb, var(--aqua) 22%, transparent); }
.model.m-gpt { background: color-mix(in srgb, var(--good) 18%, transparent); }
.model.m-gemini { background: color-mix(in srgb, var(--warn) 22%, transparent); }
.meter { position: relative; display: inline-flex; align-items: center; width: 84px; height: 18px; border-radius: 9px; background: color-mix(in srgb, var(--accent) 14%, transparent); overflow: hidden; vertical-align: middle; }
.meter .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 9px; }
.meter.high .fill { background: var(--warn); }
.meter.full .fill { background: var(--bad); }
.meter .num { position: relative; width: 100%; text-align: center; font-size: 11.5px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.chip .meter { width: 64px; height: 16px; }
.chip.warnchip { background: var(--wait-bg); color: var(--warn-text); }
table.team .ok { color: var(--good-text); }
table.team .wait { color: var(--warn-text); }
@media (max-width: 640px) {
  table.team thead { display: none; }
  table.team, table.team tbody { display: block; }
  table.team tr { display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "name model m5" "now now now" "job job job" "m7 m7 m7"; gap: 4px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; }
  table.team tr:last-child { border-bottom: 0; }
  table.team td { display: block; padding: 0; border: 0; }
  table.team td.c-name { grid-area: name; } table.team td.c-model { grid-area: model; } table.team td.c-5h { grid-area: m5; }
  table.team td.c-now { grid-area: now; } table.team td.c-job { grid-area: job; } table.team td.c-7d { grid-area: m7; }
  table.team td.c-name .meta { display: inline; margin-left: 6px; }
  table.team td.c-5h::before { content: '5h '; color: var(--muted); font-size: 12px; }
  table.team td.c-7d:has(.meter)::before { content: '7 days '; color: var(--muted); font-size: 12px; }
  table.team td.c-7d > .meter { width: 120px; }
}
.onlynarrow { display: none; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
@media (max-width: 640px) {
  header .sub, header #lastRefresh { display: none; }
  .onlynarrow { display: block; }
  .need { flex-wrap: wrap; }
  .need .act { width: 100%; justify-content: flex-end; }
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><span class="dot" id="statusDot"></span><h1>Mission Control</h1><span class="sub" id="ownerLabel"></span></div>
  <div class="actions">
    <span class="meta" id="lastRefresh"></span>
    <button class="btn" id="btnRefresh" type="button">Refresh</button>
    <button class="btn ghost" id="btnSettings" type="button" aria-label="Settings" title="Settings">&#9881;</button>
  </div>
</div></header>
<main class="wrap" id="app"><noscript>This page needs JavaScript.</noscript></main>
<div id="toast" class="toast hid" role="status"></div>

<dialog id="settings">
  <h3>Settings</h3>
  <form method="dialog" id="settingsForm">
    <label class="f"><span>GitHub token (fine-grained, stays in this browser)</span><input type="password" id="fToken" autocomplete="off" placeholder="github_pat_…"></label>
    <label class="f"><span>Owner (GitHub user or org)</span><input type="text" id="fOwner"></label>
    <label class="f"><span>Repositories — one per line: <code>repo | short name | note</code></span><textarea id="fRepos" rows="6"></textarea></label>
    <div class="toolbar" style="margin:6px 0 0"><button class="btn sm" type="button" id="btnDiscover">Find my agent repos</button><span class="meta" id="discoverMsg"></span></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px">
      <label class="f"><span>Auto-refresh (min)</span><input type="number" id="fRefresh" min="1" max="120"></label>
      <label class="f"><span>Stalled after (h)</span><input type="number" id="fStale" min="1" max="72" step="0.5"></label>
      <label class="f"><span>Stuck claim after (h)</span><input type="number" id="fClaim" min="1" max="72" step="0.5"></label>
      <label class="f"><span>Agent retry window (h)</span><input type="number" id="fFail" min="1" max="72" step="0.5"></label>
      <label class="f"><span>Included Actions min</span><input type="number" id="fMinutes" min="0" step="100"></label>
    </div>
    <details style="margin-top:10px"><summary>How to create the token</summary>
      <div class="setup" id="tokenHelp2"></div>
    </details>
    <div class="dlg-actions">
      <button class="btn danger" type="button" id="btnForget">Forget token</button>
      <button class="btn" type="button" id="btnCancel">Cancel</button>
      <button class="btn primary" type="submit" id="btnSave">Save</button>
    </div>
  </form>
</dialog>

<script>
(() => {
'use strict';

/* ---------- configuration ---------- */
/* No repo names live in this file: the owner comes from the token, and the repo list is every repo of
   the owner that carries the agents' `ready` label (the routines create it on their first run). */
const DEFAULTS = {
  owner: '',
  repos: [],
  hidden: [],
  refreshMin: 5, staleHours: 2, claimHours: 3, failHours: 3, includedMinutes: 2000,
};
const LS = { token: 'mc.token', config: 'mc.config' };
const LABELS = ['plan', 'ready', 'claimed', 'in-review', 'blocked', 'pause'];
const DISPATCH_RE = /^Dispatch:\s*([\w.-]+)\s*·\s*([^·\n]*?)\s*·\s*([\w-]+)(?:\s*·\s*sha=([0-9a-f]{7,40}))?/m;
/* The team roster mirrors dispatch/config.json (fetched at start-up when served from GitHub Pages). */
const DEFAULT_TEAM = {"claimTimeoutMinutes": 45, "coolingHours": 5, "agents": [{"name": "admin", "account": 2, "model": "Fable", "pool": "admin", "cap5h": 4, "cap7d": 30, "perHour": 2, "role": "Administrator: plans plan issues, sizes new issues; never writes code"}, {"name": "claude-1", "account": 1, "model": "Opus", "pool": "home", "cap5h": 5, "cap7d": 50, "perHour": 1, "role": "Fenced repos (trading app): every build and fix there"}, {"name": "claude-2", "account": 2, "model": "Opus", "pool": "general", "cap5h": 5, "cap7d": 50, "perHour": 1, "role": "Hard tasks (size:L) and overflow"}, {"name": "claude-3", "account": 3, "model": "Sonnet", "pool": "general", "cap5h": 8, "cap7d": 80, "perHour": 1, "role": "Normal tasks (size:S/M)"}, {"name": "claude-4", "account": 4, "model": "Sonnet", "pool": "general", "cap5h": 8, "cap7d": 80, "perHour": 1, "role": "Normal tasks (size:S/M)"}], "accounts": {"1": {"cap5h": 6}, "2": {"cap5h": 8}, "3": {"cap5h": 10}, "4": {"cap5h": 10}}, "codex": {"enabled": true, "model": "GPT", "cooldownHours": 24, "role": "Reviews every PR; takes over PRs an agent could not fix"}, "antigravity": {"enabled": true, "model": "Gemini", "role": "ui / visual tasks, worked on your Mac"}};
let team = DEFAULT_TEAM;
let dispatcher = null;
const API = 'https://api.github.com';

let cfg = loadConfig();
let token = loadToken();
let model = null;
let lastRefresh = 0;
let rate = null;
let inflight = null;
let busy = false;
let tokenBad = false;
let feedScope = 'all';
let discoveredThisLoad = false;

function loadConfig() {
  try {
    const s = JSON.parse(localStorage.getItem(LS.config) || 'null');
    if (s && typeof s === 'object') {
      const c = Object.assign({}, DEFAULTS, s);
      c.repos = Array.isArray(c.repos) ? c.repos.filter(r => r && /^[\w.-]+$/.test(r.name || '')) : [];
      c.hidden = Array.isArray(c.hidden) ? c.hidden.filter(n => typeof n === 'string') : [];
      return c;
    }
  } catch (e) { /* storage unavailable */ }
  return Object.assign({}, DEFAULTS, { repos: [] });
}
function saveConfig() { try { localStorage.setItem(LS.config, JSON.stringify(cfg)); } catch (e) { toast('Could not save settings in this browser', true); } }
function loadToken() { try { return localStorage.getItem(LS.token) || ''; } catch (e) { return ''; } }
function saveToken(t) { try { if (t) localStorage.setItem(LS.token, t); else localStorage.removeItem(LS.token); } catch (e) { toast('Could not store the token in this browser', true); } }

/* ---------- small helpers ---------- */
const $ = (sel) => document.querySelector(sel);
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  for (const c of children.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}
const link = (href, text, cls) => h('a', { href, target: '_blank', rel: 'noopener noreferrer', class: cls }, text);
const now = () => Date.now();
const hoursSince = (iso) => iso ? (now() - Date.parse(iso)) / 36e5 : Infinity;
function ago(iso) {
  if (!iso) return '—';
  const s = Math.max(0, (now() - Date.parse(iso)) / 1000);
  if (s < 50) return 'just now';
  const m = s / 60; if (m < 60) return Math.round(m) + 'm ago';
  const hh = m / 60; if (hh < 48) return Math.round(hh) + 'h ago';
  return Math.round(hh / 24) + 'd ago';
}
const fmtClock = (ms) => new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const fmtNum = (n) => (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString();
const firstLine = (s, max = 110) => { const l = String(s || '').split('\n').find(x => x.trim()) || ''; return l.length > max ? l.slice(0, max - 1) + '…' : l; };
const agentOf = (body) => { const m = /^\s*Agent:\s*([\w.-]+)/im.exec(body || ''); return m ? m[1].toLowerCase() : null; };
const isCodex = (login) => /codex/i.test(login || '');
const isJules = (login) => /jules/i.test(login || '');
const isBot = (login) => /\[bot\]$/i.test(login || '');
const issueNum = (url) => { const m = /\/(\d+)$/.exec(url || ''); return m ? +m[1] : null; };
const labelsOf = (i) => (i.labels || []).map(l => typeof l === 'string' ? l : l.name);
const has = (i, l) => labelsOf(i).includes(l);
const mentions = (body, n) => new RegExp('(^|[^\\w])#' + n + '(?!\\d)').test(body || '');

let toastTimer = 0;
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.classList.toggle('bad', !!bad); t.classList.remove('hid');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hid'), bad ? 6000 : 3500);
}

/* ---------- GitHub API ---------- */
class ApiError extends Error {
  constructor(status, path, data) { super((data && data.message) || ('HTTP ' + status)); this.status = status; this.path = path; this.data = data; }
}
async function gh(path, opts = {}) {
  const headers = { 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Authorization': 'Bearer ' + token };
  if (opts.body) headers['Content-Type'] = 'application/json';
  const res = await fetch(API + path, { method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined, signal: opts.signal, cache: 'no-cache' });
  const rem = res.headers.get('x-ratelimit-remaining');
  if (rem != null) rate = { remaining: +rem, limit: +(res.headers.get('x-ratelimit-limit') || 0), reset: (+res.headers.get('x-ratelimit-reset') || 0) * 1000 };
  if (res.status === 204) return null;
  let data = null; try { data = await res.json(); } catch (e) { /* no body */ }
  if (!res.ok) throw new ApiError(res.status, path, data);
  return data;
}
function explain(err) {
  if (!(err instanceof ApiError)) return err && err.message ? err.message : String(err);
  if (err.status === 401) return 'token rejected (401)';
  if (err.status === 403) return /rate limit/i.test(err.message) ? 'rate limited' : 'no permission (403)';
  if (err.status === 404) return 'not found or no access (404)';
  return err.message + ' (' + err.status + ')';
}

/* ---------- who am I, which repos ---------- */
async function ensureOwner(signal) {
  if (cfg.owner) return;
  const me = await gh('/user', { signal });
  if (me && me.login) { cfg.owner = me.login; saveConfig(); }
}
/* Repos of the owner that the token can read and that have the agents' `ready` label. */
async function discoverRepos(signal) {
  await ensureOwner(signal);
  const list = await gh('/user/repos?affiliation=owner&sort=pushed&per_page=100', { signal });
  const owner = (cfg.owner || '').toLowerCase();
  const cands = (list || []).filter(r => r && !r.archived && r.owner && r.owner.login.toLowerCase() === owner);
  const checks = await Promise.allSettled(cands.map(r => gh('/repos/' + cfg.owner + '/' + r.name + '/labels/ready', { signal })));
  checks.forEach(s => { if (s.status === 'rejected' && s.reason && s.reason.name === 'AbortError') throw s.reason; });
  return cands.filter((r, i) => checks[i].status === 'fulfilled').map(r => r.name);
}
const shortName = (n) => n.length > 22 && n.includes('-') ? n.split('-').slice(0, 2).join('-') : n;
/* Adds newly found repos, except ones you removed in Settings (kept in cfg.hidden). */
function mergeRepos(names) {
  const have = new Set(cfg.repos.map(r => r.name.toLowerCase()).concat(cfg.hidden || []));
  let added = 0;
  for (const n of names) if (!have.has(n.toLowerCase())) { cfg.repos.push({ name: n, nick: shortName(n), note: '' }); have.add(n.toLowerCase()); added++; }
  cfg.discoveredAt = new Date().toISOString();
  saveConfig();
  return added;
}

/* ---------- loading one repo ---------- */
async function loadRepo(r, signal) {
  const base = '/repos/' + cfg.owner + '/' + r.name;
  const out = { cfg: r, name: r.name, nick: r.nick || r.name, note: r.note || '', url: 'https://github.com/' + cfg.owner + '/' + r.name, errors: [], fatal: null };
  const want = {
    meta: gh(base, { signal }),
    issues: gh(base + '/issues?state=open&per_page=100', { signal }),
    pulls: gh(base + '/pulls?state=open&per_page=50', { signal }),
    comments: gh(base + '/issues/comments?sort=updated&direction=desc&per_page=100&since=' + encodeURIComponent(new Date(now() - 7 * 864e5).toISOString()), { signal }),
    labels: gh(base + '/labels?per_page=100', { signal }),
    reviewComments: gh(base + '/pulls/comments?sort=updated&direction=desc&per_page=40', { signal }),
    runs: gh(base + '/actions/runs?per_page=20', { signal }),
    commits: gh(base + '/commits?per_page=15', { signal }),
    merged: gh(base + '/pulls?state=closed&sort=updated&direction=desc&per_page=30', { signal }),
  };
  const keys = Object.keys(want);
  const settled = await Promise.allSettled(Object.values(want));
  const got = {};
  settled.forEach((s, i) => {
    if (s.status === 'fulfilled') got[keys[i]] = s.value;
    else { got[keys[i]] = null; out.errors.push({ what: keys[i], err: s.reason }); if (s.reason && s.reason.name === 'AbortError') throw s.reason; }
  });
  const metaErr = out.errors.find(e => e.what === 'meta');
  if (metaErr && !got.issues) { out.fatal = metaErr.err; return out; }

  out.defaultBranch = (got.meta && got.meta.default_branch) || 'main';
  out.pushedAt = got.meta && got.meta.pushed_at;
  const issues = (got.issues || []).filter(i => !i.pull_request);
  out.issues = issues;
  out.counts = {}; for (const L of LABELS) out.counts[L] = issues.filter(i => has(i, L)).length;
  out.pauseIssues = issues.filter(i => has(i, 'pause'));
  out.paused = out.pauseIssues.length > 0;
  out.queue = issues.filter(i => has(i, 'ready') && !['claimed', 'blocked', 'in-review', 'jules', 'to:codex', 'to:antigravity'].some(l => has(i, l))).sort((a, b) => a.created_at.localeCompare(b.created_at));
  out.blocked = issues.filter(i => has(i, 'blocked'));
  out.claimed = issues.filter(i => has(i, 'claimed'));
  out.working = issues.filter(i => has(i, 'claimed') && !has(i, 'in-review'));
  out.plans = issues.filter(i => has(i, 'plan'));

  const comments = got.comments || [];
  const reviewComments = got.reviewComments || [];
  const lastCommentByIssue = new Map();
  for (const c of comments) { const n = issueNum(c.issue_url); if (n != null && !lastCommentByIssue.has(n)) lastCommentByIssue.set(n, c); }
  out.lastCommentByIssue = lastCommentByIssue;
  out.home = (got.labels || []).map(l => l.name).filter(n => n.startsWith('home:')).map(n => n.slice(5).toLowerCase());
  out.commentsByIssue = new Map();
  out.dispatches = [];
  for (const c of comments) {
    const n = issueNum(c.issue_url); if (n == null) continue;
    if (!out.commentsByIssue.has(n)) out.commentsByIssue.set(n, []);
    out.commentsByIssue.get(n).push(c);
    const m = DISPATCH_RE.exec(c.body || '');
    if (m) out.dispatches.push({ who: m[1].toLowerCase(), model: m[2], mode: m[3].toLowerCase(), sha: m[4] || '', at: c.created_at, num: n, url: c.html_url, repo: out });
  }

  const pulls = got.pulls || [];
  out.prs = await Promise.all(pulls.map(async (pr) => {
    const [d, c, rv] = await Promise.allSettled([
      gh(base + '/pulls/' + pr.number, { signal }),
      gh(base + '/commits/' + pr.head.sha + '/check-runs?per_page=50', { signal }),
      gh(base + '/pulls/' + pr.number + '/reviews?per_page=50', { signal }),
    ]);
    for (const s of [d, c, rv]) if (s.status === 'rejected' && s.reason && s.reason.name === 'AbortError') throw s.reason;
    let checks = c.status === 'fulfilled' ? c.value : null;
    if (!checks) {
      /* Fine-grained tokens cannot read the Checks API on private repos; the same CI results are
         readable as the Actions runs of the PR's head commit (Actions: Read). Latest run per workflow. */
      try {
        const runs = await gh(base + '/actions/runs?head_sha=' + encodeURIComponent(pr.head.sha) + '&per_page=50', { signal });
        const latest = new Map();
        for (const w of ((runs && runs.workflow_runs) || [])) {
          const prev = latest.get(w.name);
          if (!prev || (w.created_at || '') > (prev.created_at || '')) latest.set(w.name, w);
        }
        checks = { check_runs: [...latest.values()].map(w => ({ name: w.name, status: w.status, conclusion: w.conclusion, completed_at: w.updated_at })) };
      } catch (e) {
        if (e && e.name === 'AbortError') throw e;
        if (!out.errors.some(x => x.what === 'checks')) out.errors.push({ what: 'checks', err: e });
      }
    }
    return analyzePR(pr, d.value, checks, rv.value, reviewComments, comments);
  }));
  out.stuck = out.claimed.filter(i => hoursSince(i.updated_at) > cfg.claimHours && !out.prs.some(p => mentions(p.pr.body, i.number)));

  /* agent heartbeats */
  const beats = [];
  for (const c of comments) {
    const m = /^\s*(Claimed|Planning) by ([\w.-]+)/i.exec(c.body || '');
    const n = issueNum(c.issue_url);
    if (m) beats.push({ agent: m[2].toLowerCase(), at: c.created_at, what: (m[1].toLowerCase() === 'claimed' ? 'claimed #' : 'planning #') + n, url: c.html_url, n });
    else if (isCodex(c.user && c.user.login)) beats.push({ agent: 'codex', at: c.created_at, what: 'commented on #' + n, url: c.html_url, n });
    else if (isJules(c.user && c.user.login)) beats.push({ agent: 'jules', at: c.created_at, what: 'commented on #' + n, url: c.html_url, n });
  }
  for (const c of reviewComments) {
    if (isCodex(c.user && c.user.login)) beats.push({ agent: 'codex', at: c.created_at, what: 'reviewed PR #' + issueNum(c.pull_request_url), url: c.html_url });
  }
  for (const p of out.prs) {
    if (p.agent) beats.push({ agent: p.agent, at: p.pr.updated_at, what: 'PR #' + p.number + ' updated', url: p.pr.html_url });
    else if (isJules(p.pr.user && p.pr.user.login)) beats.push({ agent: 'jules', at: p.pr.updated_at, what: 'PR #' + p.number + ' updated', url: p.pr.html_url });
    for (const r of p.codexReviews) beats.push({ agent: 'codex', at: r.submitted_at, what: 'reviewed PR #' + p.number, url: r.html_url || p.pr.html_url });
  }
  out.beats = beats;
  const claudeBeats = beats.filter(b => /^claude/.test(b.agent));
  out.lastClaudeAt = claudeBeats.length ? claudeBeats.map(b => b.at).sort().pop() : null;
  out.lastBeat = beats.length ? beats.slice().sort((a, b) => b.at.localeCompare(a.at))[0] : null;
  out.stalled = out.queue.length > 0 && !out.paused && hoursSince(out.lastClaudeAt) > cfg.staleHours;

  /* CI on the default branch */
  const runs = (got.runs && got.runs.workflow_runs) || [];
  out.runs = runs;
  out.mainRun = runs.find(x => x.head_branch === out.defaultBranch) || null;
  out.ciError = out.errors.find(e => e.what === 'runs');

  const commits = got.commits || [];
  out.lastCommit = commits[0] || null;
  const merged = (got.merged || []).filter(p => p.merged_at && hoursSince(p.merged_at) <= 24 * 7);
  out.merged7d = merged;

  /* activity feed */
  const feed = [];
  for (const c of comments) { const dm = DISPATCH_RE.exec(c.body || ''); feed.push({ at: c.created_at, repo: out, kind: dm ? 'dispatch' : 'comment', who: dm ? dm[1] : (c.user && c.user.login), text: '#' + issueNum(c.issue_url) + ' ' + (dm ? dm[3] + ' · ' + dm[2] : firstLine(c.body)), url: c.html_url }); }
  for (const c of reviewComments) feed.push({ at: c.created_at, repo: out, kind: 'review', who: c.user && c.user.login, text: 'PR #' + issueNum(c.pull_request_url) + ' ' + firstLine(c.body), url: c.html_url });
  for (const p of out.prs) feed.push({ at: p.pr.created_at, repo: out, kind: 'pr', who: p.agent || (p.pr.user && p.pr.user.login), text: 'opened PR #' + p.number + ' ' + p.title, url: p.pr.html_url });
  for (const p of merged) feed.push({ at: p.merged_at, repo: out, kind: 'merged', who: p.merged_by ? p.merged_by.login : 'merged', text: 'merged PR #' + p.number + ' ' + p.title, url: p.html_url });
  for (const c of commits.slice(0, 8)) feed.push({ at: (c.commit && c.commit.committer && c.commit.committer.date) || '', repo: out, kind: 'commit', who: (c.author && c.author.login) || (c.commit && c.commit.author && c.commit.author.name), text: firstLine(c.commit && c.commit.message), url: c.html_url });
  for (const r of runs.slice(0, 8)) feed.push({ at: r.updated_at, repo: out, kind: 'ci', who: r.name, text: (r.status === 'completed' ? (r.conclusion || 'done') : r.status) + ' · ' + r.head_branch + ' · ' + r.event, url: r.html_url, conclusion: r.conclusion, status: r.status });
  out.feed = feed.filter(f => f.at);
  return out;
}

function analyzePR(pr, detail, checks, reviews, reviewComments, comments) {
  const p = { pr, number: pr.number, title: pr.title, agent: agentOf(pr.body), draft: !!pr.draft };
  const runs = (checks && checks.check_runs) || [];
  const ck = { total: runs.length, success: 0, failure: 0, pending: 0, failed: [], failedAt: null };
  for (const c of runs) {
    if (c.status !== 'completed') ck.pending++;
    else if (['success', 'neutral', 'skipped'].includes(c.conclusion)) ck.success++;
    else { ck.failure++; ck.failed.push(c); if (!ck.failedAt || (c.completed_at || '') > ck.failedAt) ck.failedAt = c.completed_at || null; }
  }
  ck.state = checks ? (ck.failure ? 'failure' : ck.pending ? 'pending' : ck.total ? 'success' : 'none') : 'unknown';
  p.checks = ck;
  const latest = new Map();
  for (const r of (reviews || [])) { if (!r.user || r.state === 'PENDING') continue; latest.set(r.user.login, r); }
  p.approved = [...latest.values()].filter(r => r.state === 'APPROVED').map(r => r.user.login);
  p.changes = [...latest.values()].filter(r => r.state === 'CHANGES_REQUESTED').map(r => r.user.login);
  p.codexReviews = (reviews || []).filter(r => isCodex(r.user && r.user.login));
  p.codexNotes = reviewComments.filter(c => c.pull_request_url && issueNum(c.pull_request_url) === pr.number && isCodex(c.user && c.user.login));
  p.codexSummary = comments.filter(c => issueNum(c.issue_url) === pr.number && isCodex(c.user && c.user.login));
  p.lastCodexAt = [...p.codexReviews.map(r => r.submitted_at), ...p.codexNotes.map(c => c.created_at), ...p.codexSummary.map(c => c.created_at)].filter(Boolean).sort().pop() || null;
  p.mergeable = detail ? detail.mergeable : null;
  p.mergeableState = detail ? detail.mergeable_state : 'unknown';
  p.size = detail ? { add: detail.additions, del: detail.deletions, files: detail.changed_files } : null;

  const ageH = hoursSince(pr.created_at);
  let verdict, level;
  if (p.draft) { verdict = 'Draft'; level = 'wait'; }
  else if (p.mergeable === false || p.mergeableState === 'dirty') { verdict = 'Merge conflict'; level = 'you'; }
  else if (ck.state === 'failure') {
    const failH = ck.failedAt ? hoursSince(ck.failedAt) : ageH;
    if (p.agent && failH < cfg.failHours) { verdict = 'Checks failing · agent retries hourly'; level = 'agent'; }
    else { verdict = 'Checks failing'; level = 'you'; }
  }
  else if (p.changes.length) {
    if (p.agent) { verdict = 'Changes requested · agent will fix'; level = 'agent'; }
    else { verdict = 'Changes requested'; level = 'you'; }
  }
  else if (ck.state === 'pending') { verdict = 'Checks running'; level = 'wait'; }
  else if (p.mergeableState === 'blocked') { verdict = 'Blocked by branch rules'; level = 'you'; }
  else if (p.mergeableState === 'behind') { verdict = 'Behind base · update branch'; level = 'you'; }
  else { verdict = 'Ready to merge'; level = 'you'; }
  if (level === 'you' && verdict === 'Ready to merge' && p.codexNotes.length) verdict += ' · read Codex notes';
  p.verdict = verdict; p.level = level;
  return p;
}

/* ---------- billing (optional) ---------- */
async function loadBilling(signal) {
  const user = cfg.owner;
  try {
    const b = await gh('/users/' + user + '/settings/billing/actions', { signal });
    if (b && typeof b.total_minutes_used === 'number') return { used: b.total_minutes_used, included: b.included_minutes || cfg.includedMinutes, paid: b.total_paid_minutes_used || 0, source: 'actions' };
  } catch (e) { if (e.name === 'AbortError') throw e; }
  try {
    const d = new Date();
    const u = await gh('/users/' + user + '/settings/billing/usage?year=' + d.getUTCFullYear() + '&month=' + (d.getUTCMonth() + 1), { signal });
    const items = (u && u.usageItems) || [];
    let used = 0, net = 0, seen = false;
    for (const it of items) if (/actions/i.test(it.product || '') && /minute/i.test(it.unitType || '')) { used += +it.quantity || 0; net += +it.netAmount || 0; seen = true; }
    if (seen) return { used: Math.round(used), included: cfg.includedMinutes, net, source: 'usage' };
  } catch (e) { if (e.name === 'AbortError') throw e; }
  return null;
}

/* ---------- team roster + dispatcher status ---------- */
async function loadTeam() {
  try { const r = await fetch('dispatch/config.json', { cache: 'no-cache' }); if (r.ok) { const j = await r.json(); if (j && Array.isArray(j.agents)) team = j; } } catch (e) { /* opened from disk: keep the built-in roster */ }
}
async function loadDispatcher(signal) {
  try {
    const r = await gh('/repos/' + cfg.owner + '/mission-control/actions/workflows/dispatch.yml/runs?per_page=1', { signal });
    const run = r && r.workflow_runs && r.workflow_runs[0];
    return run ? { at: run.updated_at, status: run.status, conclusion: run.conclusion, url: run.html_url } : { none: true };
  } catch (e) { if (e && e.name === 'AbortError') throw e; return { error: (e && e.status) || true }; }
}

/* ---------- refresh ---------- */
async function refresh() {
  if (!token) { render(); return; }
  if (inflight) inflight.abort();
  const ctrl = new AbortController(); inflight = ctrl;
  setBusy(true);
  try {
    tokenBad = false;
    await ensureOwner(ctrl.signal);
    /* New agent repos appear on their own: look again on every page load and every 6 hours. */
    if (!discoveredThisLoad || !cfg.repos.length || hoursSince(cfg.discoveredAt) >= 6) {
      discoveredThisLoad = true;
      const found = await discoverRepos(ctrl.signal).catch(e => { if (e && e.name === 'AbortError') throw e; return null; });
      if (found) { const added = mergeRepos(found); if (added) toast('Added ' + added + ' new agent repo' + (added > 1 ? 's' : '')); }
    }
    const repos = await Promise.all(cfg.repos.map(r => loadRepo(r, ctrl.signal).catch(e => {
      if (e && e.name === 'AbortError') throw e;
      return { cfg: r, name: r.name, nick: r.nick || r.name, note: r.note || '', url: 'https://github.com/' + cfg.owner + '/' + r.name, errors: [], fatal: e };
    })));
    const billing = await loadBilling(ctrl.signal);
    dispatcher = await loadDispatcher(ctrl.signal);
    if (ctrl.signal.aborted) return;
    model = buildModel(repos, billing);
    tokenBad = repos.length > 0 && repos.every(r => r.fatal && r.fatal.status === 401);
    lastRefresh = now();
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    if (e instanceof ApiError && e.status === 401) tokenBad = true;
    else toast('Refresh failed: ' + explain(e), true);
  } finally {
    if (inflight === ctrl) { inflight = null; setBusy(false); }
  }
  render();
}

function buildModel(repos, billing) {
  const needs = [], agents = new Map(), feed = [];
  const totals = { queue: 0, working: 0, prs: 0, blocked: 0, merged: 0, paused: 0, plans: 0 };
  for (const r of repos) {
    if (r.fatal) continue;
    totals.queue += r.queue.length; totals.working += r.working.length; totals.prs += r.prs.length;
    totals.blocked += r.blocked.length; totals.merged += r.merged7d.length; totals.plans += r.plans.length;
    if (r.paused) { totals.paused++; needs.push({ kind: 'paused', repo: r, text: 'Paused', sub: 'Open issue ' + r.pauseIssues.map(i => '#' + i.number).join(', ') + ' carries the pause label; every agent skips this repo until it is closed.', url: r.pauseIssues[0].html_url, action: { label: 'Resume', run: () => resumeRepo(r), danger: false } }); }
    for (const p of r.prs) if (p.level === 'you') needs.push({ kind: 'pr', repo: r, text: 'PR #' + p.number + ' · ' + p.verdict, sub: p.title + ' — by ' + (p.agent || (p.pr.user && p.pr.user.login) || '?') + ', ' + ago(p.pr.created_at), url: p.pr.html_url });
    for (const i of r.stuck) needs.push({ kind: 'stuck', repo: r, text: '#' + i.number + ' claimed ' + Math.round(hoursSince(i.updated_at)) + 'h ago, no PR', sub: i.title + ' — the agent run probably died; unclaim it so the next run can take it.', url: i.html_url, action: { label: 'Unclaim', run: () => unclaim(r, i.number) } });
    for (const i of r.blocked) { const lc = r.lastCommentByIssue.get(i.number); needs.push({ kind: 'blocked', repo: r, text: '#' + i.number + ' is blocked', sub: i.title + (lc ? ' — ' + firstLine(lc.body, 140) : ''), url: i.html_url }); }
    if (r.stalled) needs.push({ kind: 'stalled', repo: r, info: true, text: r.queue.length + ' ready issue' + (r.queue.length > 1 ? 's' : '') + ' waiting, no Claude activity for ' + (r.lastClaudeAt ? Math.round(hoursSince(r.lastClaudeAt)) + 'h' : 'a while'), sub: 'The hourly routine may be off, out of usage, or failing. Check its run list.', url: 'https://claude.ai/code/routines' });
    for (const b of r.beats) {
      const a = agents.get(b.agent) || { agent: b.agent, last: null, repos: new Set() };
      if (!a.last || b.at > a.last.at) a.last = Object.assign({ repo: r }, b);
      a.repos.add(r.nick); agents.set(b.agent, a);
    }
    feed.push(...r.feed);
  }
  if (billing && billing.included && billing.used / billing.included >= 0.9) needs.push({ kind: 'billing', info: true, text: 'GitHub Actions minutes: ' + fmtNum(billing.used) + ' of ' + fmtNum(billing.included) + ' used this month', sub: 'Private-repo workflows stop (or bill) past the included minutes. Public repos are free.', url: 'https://github.com/settings/billing/summary' });
  const order = { paused: 0, pr: 1, stuck: 2, blocked: 3, stalled: 4, billing: 5 };
  needs.sort((a, b) => order[a.kind] - order[b.kind]);
  feed.sort((a, b) => b.at.localeCompare(a.at));
  const agentList = [...agents.values()].sort((a, b) => (b.last ? b.last.at : '').localeCompare(a.last ? a.last.at : ''));
  return { repos, needs, agents: agentList, feed, billing, totals, team: buildTeam(repos, agentList) };
}

/* ---------- team: who works on what, load against caps ---------- */
function buildTeam(repos, beatAgents) {
  const T = team, HOUR = 36e5, nowMs = now();
  const claimMs = (T.claimTimeoutMinutes || 45) * 6e4, coolMs = (T.coolingHours || 5) * HOUR;
  const live = repos.filter(r => !r.fatal);
  const disp = live.flatMap(r => r.dispatches || []);
  const claimerOf = (r, n) => {
    const cs = (r.commentsByIssue && r.commentsByIssue.get(n)) || [];
    for (const c of cs) { const m = /\b(?:Claimed|Planning) by ([\w.-]+)/i.exec(c.body || ''); if (m) return m[1].toLowerCase(); }
    return null;
  };
  const answered = (x) => {
    const r = x.repo, after = ((r.commentsByIssue && r.commentsByIssue.get(x.num)) || []).filter(c => c.created_at > x.at);
    if (after.some(c => new RegExp('\\b(Claimed|Planning) by ' + x.who + '\\b', 'i').test(c.body || ''))) return true;
    if (after.some(c => { const m = DISPATCH_RE.exec(c.body || ''); return m && m[3] === 'reclaimed'; })) return true;
    if (x.mode === 'fix-pr') return after.some(c => !DISPATCH_RE.test(c.body || ''));
    const i = r.issues.find(k => k.number === x.num);
    return !i || has(i, 'claimed') || has(i, 'in-review') || has(i, 'blocked');
  };
  const acct = {};
  const rows = (T.agents || []).map(a => {
    const seen = new Set(), mine = [];
    for (const x of disp) {
      if (x.who !== a.name || !['build', 'plan', 'fix-pr', 'triage'].includes(x.mode)) continue;
      if (x.mode === 'triage') { const k = Math.floor(Date.parse(x.at) / 6e4); if (seen.has(k)) continue; seen.add(k); }
      mine.push(x);
    }
    mine.sort((p, q) => q.at.localeCompare(p.at));
    const load5h = mine.filter(x => nowMs - Date.parse(x.at) <= 5 * HOUR).length;
    acct[a.account] = (acct[a.account] || 0) + load5h;
    let status = mine.length ? 'idle' : 'no tasks yet', doing = null;
    if (mine.some(x => x.mode !== 'triage' && nowMs - Date.parse(x.at) >= claimMs && nowMs - Date.parse(x.at) <= coolMs && !answered(x))) status = 'cooling';
    if (status !== 'cooling') {
      for (const r of live) for (const i of r.working) if (claimerOf(r, i.number) === a.name) { status = 'working'; doing = { r, n: i.number, url: i.html_url }; break; }
      const last = mine[0];
      if (!doing && last && nowMs - Date.parse(last.at) < claimMs) { if (last.mode === 'triage') status = 'sizing'; else { status = 'starting'; doing = { r: last.repo, n: last.num, url: last.url }; } }
    }
    const serves = a.pool === 'admin' ? 'all repos: planning + sizing'
      : a.pool === 'home' ? (live.filter(r => r.home.includes(a.name)).map(r => r.nick).join(', ') || 'its home repo (label home:' + a.name + ')')
      : 'all other agent repos';
    return { name: a.name, model: a.model, account: a.account, role: a.role || '', serves, status, doing, load5h, cap5h: a.cap5h, load7d: mine.length, cap7d: a.cap7d, last: mine[0] || null };
  });
  const issuesAll = live.flatMap(r => r.paused ? [] : r.issues.map(i => ({ r, i })));
  const anyTo = (i) => labelsOf(i).some(l => l.startsWith('to:'));
  const unassigned = issuesAll.filter(({ i }) => (has(i, 'ready') || has(i, 'plan')) && !['claimed', 'blocked', 'in-review', 'jules'].some(l => has(i, l)) && !anyTo(i)).length;
  const agQueue = issuesAll.filter(({ i }) => has(i, 'to:antigravity') && !has(i, 'claimed') && !has(i, 'in-review')).length;
  const agWorking = live.reduce((s, r) => s + r.working.filter(i => claimerOf(r, i.number) === 'antigravity').length, 0);
  const codexQueue = issuesAll.filter(({ i }) => has(i, 'to:codex') && !has(i, 'in-review')).length;
  const codexTakeovers = disp.filter(x => x.who === 'codex' && x.mode === 'fix-pr').length;
  const beat = (n) => (beatAgents.find(b => b.agent === n) || {}).last || null;
  return { rows, acct, unassigned, agQueue, agWorking, codexQueue, codexTakeovers, codexLast: beat('codex'), agLast: beat('antigravity'),
           human: live.reduce((s, r) => s + r.blocked.length, 0), dispatches7d: disp.length };
}

/* ---------- write actions ---------- */
async function createIssue(repo, title, body, labels) {
  return gh('/repos/' + cfg.owner + '/' + repo.name + '/issues', { method: 'POST', body: { title, body, labels } });
}
async function pauseRepo(repo) {
  const issue = await createIssue(repo, 'STOP — paused from Mission Control', 'Every agent stops while this issue is open. Close it to resume.', ['pause']);
  toast(repo.nick + ' paused (#' + issue.number + ')');
}
async function resumeRepo(repo) {
  for (const i of repo.pauseIssues) await gh('/repos/' + cfg.owner + '/' + repo.name + '/issues/' + i.number, { method: 'PATCH', body: { state: 'closed' } });
  toast(repo.nick + ' resumed');
}
async function unclaim(repo, n) {
  await gh('/repos/' + cfg.owner + '/' + repo.name + '/issues/' + n + '/labels/claimed', { method: 'DELETE' });
  toast('#' + n + ' unclaimed');
}
async function runAction(fn, btn) {
  if (btn) btn.disabled = true;
  try { await fn(); await refresh(); }
  catch (e) {
    const msg = (e instanceof ApiError && (e.status === 403 || e.status === 404)) ? 'Not allowed — the token needs "Issues: Read and write" on this repo' : explain(e);
    toast(msg, true); if (btn) btn.disabled = false;
  }
}
function armedButton(label, fn, cls) {
  let timer = 0;
  const b = h('button', { class: 'btn sm ' + (cls || ''), type: 'button' }, label);
  b.addEventListener('click', () => {
    if (b.classList.contains('armed')) { clearTimeout(timer); b.classList.remove('armed'); b.textContent = label; runAction(fn, b); return; }
    b.classList.add('armed'); b.textContent = 'Tap again to ' + label.toLowerCase();
    timer = setTimeout(() => { b.classList.remove('armed'); b.textContent = label; }, 6000);
  });
  return b;
}

    h('td', { class: 'c-job' }, h('div', null, (team.codex && team.codex.role) || 'Reviews every PR'), h('div', { class: 'meta' }, 'every repo')),
    h('td', { class: 'c-now' }, t.codexLast ? h('span', { class: 'meta' }, t.codexLast.what + ' · ' + ago(t.codexLast.at)) : h('span', { class: 'meta' }, 'no activity seen'), t.codexQueue ? h('div', { class: 'meta' }, t.codexQueue + ' queued (start at chatgpt.com/codex)') : null),
    h('td', { colspan: 2, class: 'c-7d' }, h('span', { class: 'meta' }, t.codexTakeovers + ' takeover' + (t.codexTakeovers === 1 ? '' : 's') + ' in 7 days'))));
  rows.push(h('tr', null,
    h('td', { class: 'c-name' }, h('b', null, 'antigravity'), h('div', { class: 'meta' }, 'your Mac')),
    h('td', { class: 'c-model' }, h('span', { class: 'model m-gemini' }, (team.antigravity && team.antigravity.model) || 'Gemini')),
    h('td', { class: 'c-job' }, h('div', null, (team.antigravity && team.antigravity.role) || 'ui tasks'), h('div', { class: 'meta' }, 'non-fenced repos')),
    h('td', { class: 'c-now' }, t.agWorking ? h('span', { class: 'ok' }, 'working on ' + t.agWorking) : h('span', { class: 'meta' }, t.agQueue ? t.agQueue + ' waiting for the Mac' : 'idle')),
    h('td', { colspan: 2, class: 'c-7d' }, h('span', { class: 'meta' }, t.agLast ? 'last seen ' + ago(t.agLast.at) : 'runs only while Antigravity is open'))));
  const accounts = Object.keys(team.accounts || {}).map(k => h('span', { class: 'chip' }, 'account ' + k + ' ', meter(t.acct[k] || 0, (team.accounts[k] || {}).cap5h || 0)));
  return h('section', null,
    h('h2', null, 'Team', h('span', { class: 'count' }, String(t.rows.length + 2))),
    chips,
    h('div', { class: 'card', style: 'overflow:auto' }, h('table', { class: 'team' },
      h('thead', null, h('tr', null, h('th', null, 'Agent'), h('th', null, 'Model'), h('th', null, 'Job'), h('th', null, 'Now'), h('th', null, 'Tasks · 5h'), h('th', null, 'Tasks · 7d'))),
      h('tbody', null, rows))),
    accounts.length ? h('div', { class: 'chips', style: 'margin-top:8px' }, h('span', { class: 'meta', style: 'align-self:center' }, 'Accounts, all routines · 5h:'), accounts) : null);
}

function renderAgents(m) {
  const rows = m.agents.map(a => h('tr', null,
    h('td', null, h('b', null, a.agent)),
    h('td', null, a.last ? [link(a.last.url, ago(a.last.at))] : '—'),
    h('td', null, a.last ? a.last.repo.nick + ' · ' + a.last.what : ''),
    h('td', null, [...a.repos].join(', '))));
  const body = rows.length ? h('table', null, h('thead', null, h('tr', null, h('th', null, 'Agent'), h('th', null, 'Last seen'), h('th', null, 'Doing'), h('th', null, 'Repos'))), h('tbody', null, rows))
    : h('div', { class: 'empty' }, 'No agent activity found yet. Agents leave "Claimed by …" comments and "Agent: …" pull requests when they run.');
  return h('section', null,
    h('h2', null, 'Agents', h('span', { class: 'count' }, String(m.agents.length))),
    h('div', { class: 'card', style: 'overflow:auto' }, body),
    h('div', { class: 'meta', style: 'margin-top:6px' }, 'The dispatcher wakes a Claude routine only when it has a task for it: ', link('https://claude.ai/code/routines', 'routines'), ' · ', link('https://chatgpt.com/codex', 'Codex tasks')));
}

function renderFeed(m) {
  const scopes = [['all', 'All']].concat(m.repos.filter(r => !r.fatal).map(r => [r.name, r.nick]));
  const bar = h('div', { class: 'chips', style: 'margin-bottom:8px' }, scopes.map(([k, label]) => h('button', { class: 'chip' + (feedScope === k ? '' : ' zero'), type: 'button', style: 'cursor:pointer', onclick: () => { feedScope = k; render(); } }, label)));
  const items = m.feed.filter(f => feedScope === 'all' || f.repo.name === feedScope).slice(0, 40);
  const list = items.map(f => {
    const tag = f.kind === 'ci' ? 'CI' : f.kind === 'review' ? 'review' : f.kind === 'pr' ? 'PR' : f.kind === 'merged' ? 'merged' : f.kind === 'commit' ? 'commit' : 'comment';
    const cls = f.kind === 'ci' ? (f.status !== 'completed' ? 'wait' : f.conclusion === 'success' ? 'ok' : 'bad') : '';
    return h('div', { class: 'ev' }, h('div', { class: 'when' }, ago(f.at)),
      h('div', { class: 'what' }, h('span', { class: 'tag' }, (feedScope === 'all' ? f.repo.nick + ' · ' : '') + tag), h('span', { class: 'who ' + cls }, f.who || ''), ' ', link(f.url, f.text || '(no text)')));
  });
  return h('section', null, h('h2', null, 'Activity'), bar, h('div', { class: 'card feed' }, list.length ? list : h('div', { class: 'empty' }, 'Nothing yet.')));
}

function render() {
  renderHeader();
  const app = $('#app');
  app.replaceChildren();
  if (!token) { app.append(renderSetup()); return; }
  if (tokenBad) { app.append(h('section', null, h('div', { class: 'card err' }, 'GitHub rejected the token (401). Open Settings and paste a new one.')), renderSetup()); return; }
  if (!model) { app.append(h('div', { class: 'empty' }, busy ? 'Loading your repos…' : 'Press Refresh to load.')); return; }
  if (!model.repos.length) {
    app.append(h('section', null, h('div', { class: 'card setup' },
      h('h2', null, 'No agent repos found yet'),
      h('p', { style: 'margin:0 0 8px' }, 'Mission Control lists every repo of yours that has the agents\' ', h('code', null, 'ready'), ' label; each Claude routine creates it on its first run. Either the routines have not run yet, or the token cannot see those repos.'),
      h('div', { class: 'toolbar' },
        h('button', { class: 'btn primary', type: 'button', onclick: (ev) => runAction(async () => { const n = mergeRepos(await discoverRepos()); toast(n ? 'Added ' + n + ' repo' + (n > 1 ? 's' : '') : 'Still none found'); }, ev.currentTarget) }, 'Look again'),
        h('button', { class: 'btn', type: 'button', onclick: openSettings }, 'Add repos by name')))));
    return;
  }
  app.append(h('div', { class: 'meta onlynarrow', style: 'margin:0 0 10px' }, 'Updated ' + fmtClock(lastRefresh) + ' · auto-refresh ' + cfg.refreshMin + 'm'));
  app.append(renderNeeds(model), renderTiles(model), renderTeam(model));
  const live = model.repos.filter(r => !r.fatal);
  const pausedAll = live.length > 0 && live.every(r => r.paused);
  const toolbar = h('div', { class: 'toolbar' },
    h('span', { class: 'meta' }, pausedAll ? 'All repos are paused.' : (model.totals.paused ? model.totals.paused + ' of ' + live.length + ' repos paused.' : 'All agents allowed to run.')),
    live.some(r => !r.paused) ? armedButton('Pause all repos', async () => { for (const r of live) if (!r.paused) await pauseRepo(r); }, 'danger') : null,
    live.some(r => r.paused) ? armedButton('Resume all', async () => { for (const r of live) if (r.paused) await resumeRepo(r); }) : null);
  app.append(h('section', null, h('h2', null, 'Projects', h('span', { class: 'count' }, String(model.repos.length))), toolbar, h('div', { class: 'grid' }, model.repos.map(renderRepo))));
  app.append(renderAgents(model), renderFeed(model));
  app.append(h('footer', null,
    h('span', null, rate ? ('GitHub API: ' + fmtNum(rate.remaining) + ' of ' + fmtNum(rate.limit) + ' calls left this hour') : ''),
    h('span', null, 'Labels: plan → the administrator splits it · ready → the dispatcher assigns it · size:S/M → Sonnet · size:L → Opus · ui → Antigravity · to:codex → Codex · claimed → agent on it · in-review → PR open · blocked → needs you · pause → everything stops'),
    h('span', null, 'Auto-refresh every ' + cfg.refreshMin + ' min while this tab is visible.')));
}

/* ---------- settings dialog ---------- */
function openSettings() {
  $('#fToken').value = token; $('#fOwner').value = cfg.owner;
  $('#fRepos').value = cfg.repos.map(r => {
    const parts = [r.name];
    if ((r.nick && r.nick !== r.name) || r.note) parts.push(r.nick || r.name);
    if (r.note) parts.push(r.note);
    return parts.join(' | ');
  }).join('\n');
  $('#fRefresh').value = cfg.refreshMin; $('#fStale').value = cfg.staleHours; $('#fClaim').value = cfg.claimHours; $('#fFail').value = cfg.failHours; $('#fMinutes').value = cfg.includedMinutes;
  $('#tokenHelp2').replaceChildren(tokenHelp());
  $('#settings').showModal();
}
function applySettings() {
  const repos = $('#fRepos').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const [name, nick, note] = l.split('|').map(x => x.trim()); return { name, nick: nick || name, note: note || '' }; }).filter(r => /^[\w.-]+$/.test(r.name));
  if (!repos.length) { toast('Add at least one repository', true); return false; }
  cfg.owner = $('#fOwner').value.trim() || cfg.owner;
  const kept = new Set(repos.map(r => r.name.toLowerCase()));
  const hidden = new Set((cfg.hidden || []).filter(n => !kept.has(n)));
  for (const r of cfg.repos) if (!kept.has(r.name.toLowerCase())) hidden.add(r.name.toLowerCase());
  cfg.hidden = [...hidden];
  cfg.repos = repos;
  cfg.refreshMin = Math.max(1, +$('#fRefresh').value || DEFAULTS.refreshMin);
  cfg.staleHours = Math.max(0.5, +$('#fStale').value || DEFAULTS.staleHours);
  cfg.claimHours = Math.max(0.5, +$('#fClaim').value || DEFAULTS.claimHours);
  cfg.failHours = Math.max(0.5, +$('#fFail').value || DEFAULTS.failHours);
  cfg.includedMinutes = Math.max(0, +$('#fMinutes').value || 0);
  saveConfig();
  const t = $('#fToken').value.trim();
  if (t !== token) { token = t; saveToken(t); tokenBad = false; }
  return true;
}

/* ---------- wiring ---------- */
$('#btnRefresh').addEventListener('click', () => refresh());
$('#btnSettings').addEventListener('click', openSettings);
$('#btnCancel').addEventListener('click', () => $('#settings').close());
$('#btnForget').addEventListener('click', () => { token = ''; saveToken(''); model = null; tokenBad = false; $('#settings').close(); render(); toast('Token removed from this browser'); });
$('#settingsForm').addEventListener('submit', (ev) => { ev.preventDefault(); if (applySettings()) { $('#settings').close(); model = null; refresh(); } });
$('#btnDiscover').addEventListener('click', async (ev) => {
  if (!token) { toast('Connect a token first', true); return; }
  const b = ev.currentTarget; b.disabled = true; $('#discoverMsg').textContent = 'Looking…';
  try {
    const names = await discoverRepos();
    if (!$('#fOwner').value.trim()) $('#fOwner').value = cfg.owner;
    const ta = $('#fRepos');
    const lines = ta.value.split('\n').map(l => l.trim()).filter(Boolean);
    const have = new Set(lines.map(l => l.split('|')[0].trim().toLowerCase()));
    const add = names.filter(n => !have.has(n.toLowerCase()));
    ta.value = lines.concat(add.map(n => shortName(n) === n ? n : n + ' | ' + shortName(n))).join('\n');
    $('#discoverMsg').textContent = names.length ? 'Found ' + names.length + ', added ' + add.length + ' — press Save.' : 'None found yet.';
  } catch (e) { $('#discoverMsg').textContent = 'Failed: ' + explain(e); }
  finally { b.disabled = false; }
});
/* Never refresh under someone typing: a refresh redraws the page and would drop an open task form. */
const editing = () => !!document.querySelector('.taskform') || $('#settings').open;
setInterval(() => { if (token && document.visibilityState === 'visible' && now() - lastRefresh > cfg.refreshMin * 60e3 && !busy && !editing()) refresh(); }, 20e3);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && token && now() - lastRefresh > 60e3 && !busy && !editing()) refresh(); });
setInterval(() => { if (model && !busy) renderHeader(); }, 30e3);

render();
loadTeam().then(() => { if (model) { model.team = buildTeam(model.repos, model.agents); render(); } });
if (token) refresh();
})();
</script>
</body>
</html>
