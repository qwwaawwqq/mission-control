name: dispatch

# Wakes the AI agents only when they have work. Runs on a schedule in this public repo, so the
# minutes are free; it uses no AI itself. It never runs on pull requests, so forks cannot reach
# the secrets.
on:
  schedule:
    # Every 15 minutes, off the quarter hours: GitHub delays or drops scheduled runs most at the
    # start of the hour, and on 20-21 Oct a '*/15' schedule here ran only every 2.5 to 5 hours.
    - cron: '4,19,34,49 * * * *'
  # Also started from outside, so agents don't wait on GitHub's late schedule: the Apps Script
  # backstop (every 15 min) or a repo's wake workflow (on a ready/plan label) calls
  # POST /repos/OWNER/mission-control/actions/workflows/dispatch.yml/dispatches {"ref":"main"}
  # with a token that has only Actions: Read and write on this repo. See dispatch/SETUP.md.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # pinned to the commit behind v5.1.0, so a moved tag cannot change what runs next to the secrets
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Dispatch
        run: node dispatch/dispatcher.mjs
        env:
          DISPATCH_GH_TOKEN: ${{ secrets.DISPATCH_GH_TOKEN }}
          ROUTINE_ADMIN: ${{ secrets.ROUTINE_ADMIN }}
          ROUTINE_CLAUDE_1: ${{ secrets.ROUTINE_CLAUDE_1 }}
          ROUTINE_CLAUDE_2: ${{ secrets.ROUTINE_CLAUDE_2 }}
          ROUTINE_CLAUDE_3: ${{ secrets.ROUTINE_CLAUDE_3 }}
          ROUTINE_CLAUDE_4: ${{ secrets.ROUTINE_CLAUDE_4 }}
          # each routine's URL, if it is not in the secret (Settings → Secrets and variables → Actions → Variables)
          ROUTINE_ADMIN_URL: ${{ vars.ROUTINE_ADMIN_URL }}
          ROUTINE_CLAUDE_1_URL: ${{ vars.ROUTINE_CLAUDE_1_URL }}
          ROUTINE_CLAUDE_2_URL: ${{ vars.ROUTINE_CLAUDE_2_URL }}
          ROUTINE_CLAUDE_3_URL: ${{ vars.ROUTINE_CLAUDE_3_URL }}
          ROUTINE_CLAUDE_4_URL: ${{ vars.ROUTINE_CLAUDE_4_URL }}
